aid: butterpayments
name: Butterpayments
description: >-
  Butter Payments is a payment recovery and involuntary-churn platform that uses machine learning to
  recover revenue from failed subscription payments. Its Recover product ingests real-time transaction
  and payment-method events, optimizes retry timing, and reports outcomes back to merchants via
  HMAC-SHA256 signed webhooks; Dispute (powered by Verifi) intercepts chargebacks and runs Rapid Dispute
  Resolution; PaymentScore identifies recoverable failed payments; and a PCI DSS Level 2 Card Vault
  secures card data behind a secure-iframe element. Butter integrates turnkey with Stripe Billing,
  Braintree, and Recharge, or directly through the Recover Enterprise API.
